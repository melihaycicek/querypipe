name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version read from packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter querypipe --filter "@querypipe/*" -r build

      - name: Typecheck
        run: pnpm --filter querypipe --filter "@querypipe/*" -r typecheck

      - name: Frozen public API contract typechecks
        run: pnpm run check:contract

      - name: Tests (conformance vectors + property-based invariants)
        run: pnpm --filter querypipe --filter "@querypipe/*" -r test

      - name: publint (packaging lint)
        run: pnpm --filter querypipe exec publint

      - name: arethetypeswrong (dual-format types)
        run: pnpm --filter querypipe exec attw --pack .

      - name: Bundle size gate (8 KiB min+gzip; 6 KiB goal tracked in ADR-0003)
        run: pnpm --filter querypipe size
